spring:
  application:
    name: flash-sale-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FlashSaleHikariPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  task:
    scheduling:
      # 三个定时任务（JOB-01/02/03）各自独占线程，避免 JOB-03 单轮耗时拖慢 JOB-01/02
      pool:
        size: ${SCHEDULING_POOL_SIZE:3}
      thread-name-prefix: seckill-sched-

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.example.flashsale.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      group:
        db:
          include: db
    info:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # v3 在 200 线程同瞬建连时偶发 Connection refused（r1/r3 各 51/33 次），归因 accept 队列深度不足
    # （Tomcat 默认 100）。v4 调大为 200 验证突发建连；threads.max / max-connections 保持默认，
    # 一次只动一个变量以保证可归因。压测跑 dev profile，故写入基础 application.yml（同时覆盖 dev/prod）。
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:200}

seckill:
  rate-limit:
    user-per-second: ${SECKILL_RATE_LIMIT_USER_PER_SECOND:5}
    ip-per-second: ${SECKILL_RATE_LIMIT_IP_PER_SECOND:20}
  slow-sql:
    # 慢 SQL 日志阈值（ms）：仅对 SELECT/UPDATE 生效，执行耗时超阈值打 WARN
    threshold-ms: ${SECKILL_SLOW_SQL_THRESHOLD_MS:500}

logging:
  level:
    com.zaxxer.hikari: DEBUG
